name: Financial model regression tests
on:
  push:
    branches: [main]
    paths:
      - "src/secondcup/**"
      - "data/**"
      - "tests/**"
      - "lever1_hq_financing.py"
      - "lever2_landlord_acquisition.py"
      - "landlord_cost_sensitivity.py"
      - "lever3_deferred_fee.py"
      - "integrated_levers.py"
      - "participation_uplift.py"
      - "strategy_b_attribution.py"
      - "model_team_deck.py"
      - ".github/workflows/model-tests.yml"
  pull_request:
    paths:
      - "src/secondcup/**"
      - "data/**"
      - "tests/**"
      - "lever1_hq_financing.py"
      - "lever2_landlord_acquisition.py"
      - "landlord_cost_sensitivity.py"
      - "lever3_deferred_fee.py"
      - "integrated_levers.py"
      - "participation_uplift.py"
      - "strategy_b_attribution.py"
      - "model_team_deck.py"
      - ".github/workflows/model-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library model regression tests
        run: python -m unittest discover -s tests -v
      - name: Run Lever 1 standalone
        run: python lever1_hq_financing.py --rates 0 0.6666666667 1
      - name: Run Lever 2 standalone
        run: python lever2_landlord_acquisition.py
      - name: Run Lever 1 and 2 integrated
        run: python lever2_landlord_acquisition.py --with-financing
      - name: Run Landlord cost sensitivity and break-even
        run: python landlord_cost_sensitivity.py
      - name: Run Landlord cost sensitivity with financing
        run: python landlord_cost_sensitivity.py --with-financing

      - name: Run Lever 3 standalone
        run: python lever3_deferred_fee.py
      - name: Run legacy fixed-60 lever combinations for regression
        run: python integrated_levers.py --fixed-60 --output outputs/integrated
      - name: Run financing-led participation sensitivity
        run: python participation_uplift.py
      - name: Run consent-aware eight-lever combinations
        run: python integrated_levers.py --participation-uplift --output outputs/integrated_participation
      - name: Run Strategy B common-cost and lever attribution
        run: python strategy_b_attribution.py
      - name: Run team-deck aligned primary financial model
        run: python model_team_deck.py
      - name: Run illustrative 5 percent no-slots sales leakage downside
        run: python model_team_deck.py --leakage-without-slots .05 --output outputs/team_deck_risk_5pct
      - name: Run higher landlord coordination cost stress
        run: python model_team_deck.py --landlord-setup 5000 --landlord-annual 10000 --output outputs/team_deck_landlord_cost_stress
      - name: Run supporting fee removed sensitivity
        run: python model_team_deck.py --supporting-fee 0 --output outputs/team_deck_no_fee
      - name: Run weaker landlord conversion sensitivity
        run: python model_team_deck.py --landlord-conversion .15 --output outputs/team_deck_conversion_15pct
      - name: Run 50 percent noninterested consent stress
        run: python model_team_deck.py --financing-conversion .5 --output outputs/team_deck_financing_50pct
      - name: Run 67 percent noninterested consent stress
        run: python model_team_deck.py --financing-conversion .6666666667 --output outputs/team_deck_financing_67pct
      - name: Upload integrated model results
        uses: actions/upload-artifact@v4
        with:
          name: integrated-lever-analysis
          path: |
            outputs/integrated/
            outputs/deferred_fee/
            outputs/integrated_participation/
            outputs/participation/
            outputs/strategy_b_attribution/
            outputs/team_deck/
            outputs/team_deck_risk_5pct/
            outputs/team_deck_landlord_cost_stress/
            outputs/team_deck_no_fee/
            outputs/team_deck_conversion_15pct/
            outputs/team_deck_financing_50pct/
            outputs/team_deck_financing_67pct/
          if-no-files-found: error
      - name: Upload landlord cost-analysis results
        uses: actions/upload-artifact@v4
        with:
          name: landlord-cost-analysis
          path: outputs/landlord/cost_sensitivity/
          if-no-files-found: error
